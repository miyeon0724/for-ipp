<script>

    theme: {
      extend: {
        fontFamily: {
          // 디자인 고도화 - 시스템 기본 글꼴 대신 Pretendard(한글 서비스에서 널리 쓰이는
          // 정제된 서체)를 전체 화면 기본 글꼴로 사용합니다.
          sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif']
        },
        boxShadow: {
          // 디자인 고도화 - 기존 border만 쓰던 카드/모달에 은은한 그림자 톤을 추가해서
          // 층위감(depth)을 살짝 더합니다 (과하지 않게 - 그림자 하나만 사용).
          card: '0 1px 2px 0 rgba(15, 23, 42, 0.04), 0 1px 3px 0 rgba(15, 23, 42, 0.06)',
          panel: '0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 10px 24px -6px rgba(15, 23, 42, 0.08)'
        },
        colors: {
          // 지정 브랜드 컬러 #0857C3를 brand-600으로 설정. 전 화면의 bg-brand-*,
          // text-brand-*, border-brand-*, focus:ring-brand-* 가 전부 이 팔레트를 참조하므로
          // 여기 한 곳만 바꿔도 앱 전체 포인트 컬러가 일괄 적용됩니다.
          brand: {
            50:'#eef4fc',100:'#d9e8f8',200:'#b3d1f1',300:'#7fb0e6',400:'#4a8cd6',
            500:'#1f6cc7',600:'#0857C3',700:'#064294',800:'#05336f',900:'#042753'

        }
      }
    }
  }

<style>
  /* Tailwind CDN 에는 없는 아주 소소한 보조 스타일만 최소로 사용 */
  html{ font-feature-settings: "tnum" 1; } /* 표/숫자 데이터가 많은 업무툴이라 고정폭 숫자로 정렬을 깔끔하게 */

  .cat-tab:hover{ background:rgba(255,255,255,.08); color:#fff; }
  .cat-tab.active{ background:#0857C3; color:#fff; }
  /* 결재/검토함에서 "내 담당 파트" 탭 강조 - 굵은 금색 글씨 + 아래 점 표시로,
     선택 여부와 무관하게 항상 한눈에 구분되도록 했습니다. */
  .cat-tab-mine{ color:#fbbf24; font-weight:700; }
  .cat-tab-mine:hover{ color:#fff; }
  .cat-tab-mine::after{ content:''; position:absolute; left:50%; bottom:2px; transform:translateX(-50%); width:4px; height:4px; border-radius:9999px; background:#fbbf24; }
  .cat-tab-mine.active{ color:#fff; }
  .cat-tab-mine.active::after{ background:#fef3c7; }
  /* 결재함/검토함 탭에 붙는 "내가 처리해야 할 건수" 표시 */
  .cat-tab-count{ display:inline-block; min-width:1.125rem; margin-left:.375rem; padding:0 .3rem; border-radius:9999px; background:#e11d48; color:#fff; font-size:.6875rem; font-weight:700; line-height:1.125rem; text-align:center; }

  @keyframes fadeIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(8px) scale(.98); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .modal-panel{ animation: modalIn .18s cubic-bezier(.16,1,.3,1); }
  /* 날짜 형식이 잘못됐을 때 입력창을 살짝 흔들어서 직관적으로 알려주는 애니메이션 */
  @keyframes shakeX{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-4px); }
    40%{ transform:translateX(4px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
  }

  /* 모든 리스트/대장 테이블의 행 높이를 통일합니다. 제목 등이 길어도 truncatedCellHtml로
     한 줄 처리되므로, 셀 높이가 내용 길이에 따라 들쭉날쭉해지지 않고 항상 일정하게 유지됩니다. */
  /* 열 폭 자동 맞춤 표: 가로 스크롤 없이 화면 폭에 맞춰 열 폭을 나눕니다 (긴 글은 한 줄에서 … 로 줄이고, 마우스를 올리면 전체가 보입니다). */
table.fit-table{ width:100%; table-layout:fixed; }
table.fit-table td{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
   table.fit-table th, table.fit-table td{ padding-left:.5rem; padding-right:.5rem; } /* 칸 좌우 여백을 줄여 같은 폭에 더 많이 보이게 (날짜·버튼 칸이 잘리지 않도록) */
table thead th{ text-align:center !important; } /* 모든 표의 열 제목은 가운데 정렬 (값의 정렬은 그대로) */
table tbody td{ text-align:center !important; } /* 표의 내용도 가운데 정렬 */
table tbody td.text-right{ text-align:right !important; } /* 단, 천 단위 쉼표 금액만 오른쪽 정렬 유지 */
table tbody td:not(.text-right) .truncate{ margin-left:auto; margin-right:auto; } /* 폭이 제한된 긴 글자 상자도 칸 가운데로 */
  table.fit-table th{ overflow:hidden; white-space:normal; overflow-wrap:anywhere; line-height:1.2; } /* 머리글은 좁은 열에서 두 줄로 줄바꿈 */
table.fit-table .truncate:not(td):not(th){ max-width:100% !important; display:block; } /* 칸 안의 글자 상자만 block으로 (칸 자체를 block으로 바꾸면 표가 깨져 행 높이가 늘어납니다) */
table tbody tr{ height:44px; }
  table tbody td{ height:44px; }
   .list-loading{ opacity:.45; transition:opacity .1s; pointer-events:none; } /* 쪽 이동·검색 조회 중에는 목록을 살짝 흐리게 */
   /* ===== 전체 로딩 표시: 서버에서 불러오는 동안 화면 한가운데에 동그란 표시 ===== */
   /* ===== 열 선택 복사: 머리글을 눌러 열을 고르면 그 열이 파랗게 표시됩니다 ===== */
   .col-sel-th{ cursor:pointer; user-select:none; }

   .cf-hide{ display:none !important; }

   .cf-btn:hover{ background:#e2e8f0; color:#334155; }

   .cf-title{ font-weight:700; margin-bottom:6px; color:#0f172a; }
   .cf-sec{ padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid #e2e8f0; }
   .cf-lab{ font-weight:600; margin-bottom:4px; color:#475569; }
   .cf-in{ border:1px solid #cbd5e1; border-radius:6px; padding:4px 6px; font-size:12px; min-width:0; }
   .cf-list{ max-height:230px; overflow:auto; border:1px solid #e2e8f0; border-radius:6px; padding:2px; }
   .cf-item{ display:flex; align-items:center; gap:6px; padding:3px 6px; border-radius:4px; cursor:pointer; }
   .cf-item:hover{ background:#f1f5f9; }
   .cf-val{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
   .cf-cnt{ color:#94a3b8; font-size:11px; }
   .cf-foot{ display:flex; align-items:center; gap:6px; margin-top:8px; }
   .cf-mini{ padding:3px 8px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; font-size:12px; color:#475569; }
   .cf-mini:hover{ background:#f1f5f9; }
   .cf-ok{ padding:4px 14px; border-radius:6px; background:#0857C3; color:#fff; font-weight:600; font-size:12px; }
   .cf-ok:hover{ background:#064294; }
   /* ===== 셀 선택: 셀을 누르면 파랗게 선택됩니다 ===== */
   #main-content table[data-cellsel] td{ user-select:none; cursor:cell; }
   td.cell-sel-on{ background-color:#dbeafe !important; box-shadow:inset 0 0 0 1px #0857C3; }
   th.col-sel-on{ background-color:#cfe0f5 !important; box-shadow:inset 0 -3px 0 #0857C3; }
   td.col-sel-on{ background-color:#eaf2fc !important; }
   #global-loading-spinner{ position:fixed; top:50%; left:50%; width:64px; height:64px; margin:-32px 0 0 -32px; z-index:70; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transform:scale(.9); transition:opacity .12s, transform .12s; }
   #global-loading-spinner.on{ opacity:1; transform:none; }
   .gl-ring{ width:60px; height:60px; border:7px solid #dbe7f6; border-top-color:#0857C3; border-radius:50%; animation:gl-rot .8s linear infinite; }
   @keyframes gl-rot{ to{ transform:rotate(360deg); } }
   table td.col-badge{ overflow:visible !important; text-overflow:clip !important; } /* 진행상태 배지 칸은 줄임표(…) 없이 배지 전체가 항상 보임 */
   table.fit-table th.col-badge{ width:8.5rem; } /* 배지 칸은 가장 긴 상태 이름(최종 체결 대기 등)이 들어갈 폭으로 고정 */
</style>
</head>

<script>
/* =====================================================================
 * [목업용 샘플 서버] 실제 서버(구글 앱스크립트) 대신, 브라우저 안에서 가상의 샘플 데이터를 돌려줍니다.
 * 화면 코드는 실제 시스템과 같고, 서버만 이 파일로 바뀌었습니다. 입력·저장·승인 같은 쓰기 작업은 아무것도 저장하지 않고
 * "(목업) 실제로 저장되지 않았습니다" 안내만 돌려줍니다. 모든 이름·회사·번호는 가상의 값입니다.
 * ===================================================================== */
(function () {
  const clone = o => JSON.parse(JSON.stringify(o));
  const DOMAIN = 'example.com';
  const em = id => id + '@' + DOMAIN;
  const PEOPLE = [
    { id: 'miyeon', name: '정미연', dept: '경영지원팀', role: '전체 수정', no: 'E1001' },
    { id: 'jimin.han', name: '한지민', dept: '경영지원팀', role: '', no: 'E1002' },
    { id: 'gildong.hong', name: '홍길동', dept: '영업1팀', role: '', no: 'E1012' },
    { id: 'sua.choi', name: '최수아', dept: '영업1팀', role: '', no: 'E1013' },
    { id: 'woojin.jung', name: '정우진', dept: '영업2팀', role: '팀장', no: 'E1030' },
    { id: 'minsu.park', name: '박민수', dept: '영업2팀', role: '', no: 'E1033' },
    { id: 'younghee.kim', name: '김영희', dept: '기획팀', role: '팀장', no: 'E1020' },
    { id: 'doyun.lee', name: '이도윤', dept: '기획팀', role: '', no: 'E1021' },
    { id: 'seoyeon.lee', name: '이서연', dept: '개발팀', role: '파트장', no: 'E1041' },
    { id: 'sehoon.oh', name: '오세훈', dept: '대표', role: '대표', no: 'E0001' }
  ];
  const ME = em('miyeon');
  const nameOf = e => { const p = PEOPLE.find(x => em(x.id) === e); return p ? p.name : String(e).split('@')[0]; };
  const staffRows = () => PEOPLE.map(p => ({ email: em(p.id), name: p.name, department: p.dept, employeeId: p.no, role: p.role }));
  const DEPARTMENTS = ['경영지원팀', '사업관리팀', '영업1팀', '영업2팀', '기획팀', '개발팀'];

  /* ---- 사용 가능한 모든 메뉴·버튼이 보이도록, 모든 권한을 가진 경영지원팀 담당자로 보여줍니다 ---- */
  const ALL = [1, 1, 1, 1, 1];
  const GRID = { seal: ALL, contract: ALL, invoice: ALL, legal: ALL, status: ALL, admin: ALL, sledger: ALL, cledger: ALL, iledger: ALL };

  /* ---- 샘플 신청 건 (가상) ---- */
  const COMPANIES = ['가나다상사', '라마바(주)', '사아자컴퍼니', '차카타(주)', '파하거래처', '에이비씨테크'];
  const iso = (m, d, h) => `2026-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}T${String(h || 1).padStart(2, '0')}:00:00Z`;
  const seal = (n, o) => Object.assign({ type: 'SEAL', docId: 'SEAL-202611-' + String(n).padStart(4, '0'), requestedAt: iso(11, 3 + n % 20), submittedAt: iso(11, 3 + n % 20), title: '물품 공급 계약서', counterpartyOrTarget: COMPANIES[n % 6], department: '영업1팀', manager: em('gildong.hong'), requesterEmail: em('gildong.hong'), requester: em('gildong.hong'), contractType: '매출', amount: '5,000,000', startDate: '2026-11-01', endDate: '2027-10-31', stampSummary: '사용인감 1부', formType: '계약서', status: '날인완료', currentStage: 'DONE', rejected: false, __cancelled: false, refDepartments: '', refPeople: '', ledger: { '날인시기': '2026-11-04 14:20', '날인자': nameOf(ME), '인감구분': '사용인감', '계약구분': '매출' } }, o);
  const contract = (n, o) => Object.assign({ type: 'CONTRACT', docId: 'CNT-202611-' + String(n).padStart(4, '0'), requestedAt: iso(11, 3 + n % 20), submittedAt: iso(11, 3 + n % 20), title: '용역 계약서', counterparty: COMPANIES[n % 6], counterpartyOrTarget: COMPANIES[n % 6], department: '기획팀', manager: em('younghee.kim'), requesterEmail: em('younghee.kim'), requester: em('younghee.kim'), contractType: '매입', amount: '12,000,000', startDate: '2026-11-01', endDate: '2027-10-31', status: '계약완료', currentStage: 'DONE', rejected: false, __cancelled: false, ledger: { '체결일': '2026-11-10' }, refDepartments: '', refPeople: '' }, o);

upShown_.forEach(e=>localStorage.setItem(e.key,String(e.stage))),expiryPopupShown_=[];const e=$("#expiry-popup-dismiss-today");e&&e.checked&&localStorage.setItem(EXPIRY_POPUP_DISMISS_KEY,todayDateStr_()),closeModal()}function openExpiryAcknowledgeModal(e){openModal(`\n    <h2 class="text-lg font-bold text-slate-900 mb-2">${esc(e.title)}</h2>\n    <p class="text-sm text-slate-600 mb-5">${e.dday<0?`이 계약은 계약종료일 경과 (${esc(e.endDate)}).`:`이 계약은 계약종료일 임박 (${esc(e.endDate)}, ${esc(dDayLabel(e.dday))}).`} 어떻게 처리하시겠습니까?</p>\n    <div class="flex flex-col gap-2">\n      <button id="exp-renew-btn" class="w-full px-4 py-3 text-left rounded-md border border-brand-300 hover:bg-brand-50">\n        <div class="font-semibold text-sm text-brand-700">계약 갱신</div>\n        <div class="text-xs text-slate-400 mt-0.5">계약기간 연장 및 계약 정보 수정</div>\n      </button>\n      <button id="exp-end-btn" class="w-full px-4 py-3 text-left rounded-md border border-slate-300 hover:bg-slate-50">\n        <div class="font-semibold text-sm text-slate-700">계약 종료 처리</div>\n        <div class="text-xs text-slate-400 mt-0.5">재계약 없이 종료됨을 확인. 이후 이 계약에 대한 경고 해제</div>\n      </button>\n    </div>\n    <div class="flex justify-end mt-5">\n      <button class="px-4 py-2 text-sm rounded-md border border-slate-300 text-slate-600 hover:bg-slate-50" onclick="closeModal()">닫기</button>\n    </div>\n  `),$("#exp-renew-btn").addEventListener("click",()=>{closeModal(),openContractRevisionForm_(e,!0)}),$("#exp-end-btn").addEventListener("click",()=>{openModal(`\n      <h2 class="text-lg font-bold text-slate-900 mb-2">계약 종료 처리</h2>\n      <p class="text-sm text-slate-600 mb-1">정말로 이 계약을 만료 처리하시겠습니까?</p>\n      <p class="text-xs text-slate-400 mb-5">${esc(e.title)} · 재계약 없이 종료됨을 확인하는 처리이며, 이후 이 계약에 대한 만료 경고 해제</p>\n      <div class="flex justify-end gap-2">\n        <button class="px-4 py-2 text-sm rounded-md border border-slate-300 text-slate-600 hover:bg-slate-50" onclick='openExpiryAcknowledgeModal(${JSON.stringify(e).replace(/
